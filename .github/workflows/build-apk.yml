name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version"
            exit 1
          fi
          echo "Detected Java Major Version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version $JAVA_VER is lower than 17"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Selected APK is empty"
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) echo "APK verified: $EXPECTED_APK" ;;
            *) echo "Error: File does not have .apk extension"; exit 1 ;;
          esac

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK release asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          CLEAN_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/_/g')
          DEST_FILENAME="${CLEAN_NAME}-debug.apk"
          DEST_PATH="${RUNNER_TEMP}/${DEST_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          echo "ASSET_PATH=$DEST_PATH" >> $GITHUB_ENV
          echo "Asset prepared at $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Automated debug APK build for commit ${{ github.sha }}." \
            --latest

      - name: Report APK download result
        if: always()
        run: |
          echo "## Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "* **Run Number:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "* **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            echo "### Release Published" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK was published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Artifact Uploaded" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK artifact **app-debug-apk** is available in GitHub Actions artifacts." >> $GITHUB_STEP_SUMMARY
          fi
